# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js project to Azure Function App - rg-vitalparse-dev-centralindia

on:
  push:
    branches:
      - azure/prod
    paths:
      - 'apps/functions/**'
      - '.github/workflows/azure-prod_rg-vitalparse-dev-centralindia.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'apps/functions' # set this to the path to your web app project, defaults to the repository root
  NODE_VERSION: '22.x' # set this to the node version to use (supports 8.x, 10.x, 12.x)

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout
      
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }} Environment
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 'Resolve Project Dependencies Using Npm'
        shell: bash
        run: |
          mkdir -p func-deploy-temp
          mv package.json package.json.bak
          mv package-lock.json package-lock.json.bak
          cp -r ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/* func-deploy-temp/
          cp -r ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/.* func-deploy-temp/ 2>/dev/null || true
          cd func-deploy-temp
          npm install --production
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: func-deploy-temp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: 5146fde3-de21-4b56-b58c-e869d4010a5e
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4FAB5D4A814F4FF28252CCCE9B748402 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_25028F918C2C42848564C694610050DD }}

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'func-vitalparse-dev-cin'
          slot-name: 'Production'
          package: '.'
          